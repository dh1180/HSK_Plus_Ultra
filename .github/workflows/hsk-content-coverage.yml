name: HSK Korean content coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Sync official HSK vocabulary
        run: npm run sync:hsk
      - name: Check Korean dictionary coverage
        run: node scripts/check-krdict-coverage.mjs
      - name: Check Korean Wiktionary coverage
        run: node scripts/check-kowiktionary-coverage.mjs
      - name: Build Korean meanings
        run: node scripts/build-korean-meanings.mjs
      - name: Upload candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: meaning-candidates
          path: |
            src/data/korean-meanings.json
            data/content-missing.json
          if-no-files-found: error
