name: HSK Korean content coverage

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-krdict-coverage.mjs'
      - 'scripts/check-kowiktionary-coverage.mjs'
      - 'scripts/build-korean-meanings.mjs'
      - 'src/data/fallbacks/**'
      - '.github/workflows/hsk-content-coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Sync official HSK vocabulary
        run: npm run sync:hsk
      - name: Check Korean dictionary coverage
        run: node scripts/check-krdict-coverage.mjs
      - name: Check Korean Wiktionary coverage
        run: node scripts/check-kowiktionary-coverage.mjs
      - name: Build Korean meanings
        run: node scripts/build-korean-meanings.mjs
      - name: Commit Korean content data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/krdict-coverage.json data/krdict-missing.json data/kowiktionary-coverage.json data/content-missing.json src/data/korean-meanings.json
          if git diff --cached --quiet; then
            echo "Korean content data unchanged"
          else
            git commit -m "data: HSK 2~6 한국어 뜻 5100개 생성"
            git pull --rebase origin main
            git push
          fi
