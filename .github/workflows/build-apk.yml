name: Build Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tsconfig.json'
      - '.gitignore'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Sync HSK 1-6 vocabulary
        run: npm run sync:hsk

      - name: Commit HSK vocabulary snapshot
        run: |
          git add src/data/generated-hsk.json
          if git diff --cached --quiet; then
            echo "Vocabulary snapshot is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: HSK 1~6 공식 단어 데이터 동기화"
          git push

      - name: Restore app icon
        run: npm run restore:icon

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSK-Plus-Ultra-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
