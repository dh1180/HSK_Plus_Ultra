name: Build Android APK

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tsconfig.json'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy tools package is no longer served by Google.
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned content and application
        run: npm run check

      - name: Restore app icon
        run: npm run restore:icon

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Use preinstalled NDK 27 LTS
        run: |
          test -f "$ANDROID_HOME/ndk/27.3.13750724/source.properties"
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('android/build.gradle')
          content = path.read_text()
          marker = 'apply plugin: "expo-root-project"'
          if content.count(marker) != 1:
              raise SystemExit('Unexpected Expo root Gradle template; review the NDK override')
          path.write_text(content.replace(marker, "ext.ndkVersion = '27.3.13750724'\n" + marker))
          PYTHON

      - name: Build QA APK (not a store signing key)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: HSK-Plus-Ultra-QA-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
