name: HSK example content

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Sync official HSK vocabulary
        run: npm run sync:hsk

      - name: Install CPU PyTorch
        run: pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install example generation dependencies
        run: pip install --disable-pip-version-check transformers sentencepiece pypinyin jieba

      - name: Build HSK 2-6 example content
        run: python scripts/build-hsk-examples.py

      - name: Upload candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: example-candidates
          path: |
            src/data/example-content.json
            data/example-content-report.json
          if-no-files-found: error
